<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcana Duel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" data-go="top">ARCANA <span>DUEL</span></div>
    <div id="who"></div>
  </header>
  <main>
    <section id="scr-top" class="screen"></section>
    <section id="scr-battle" class="screen"></section>
    <section id="scr-deck" class="screen"></section>
    <section id="scr-shop" class="screen"></section>
    <section id="scr-settings" class="screen"></section>
    <section id="scr-game" class="screen"></section>
  </main>
</div>
<div id="modal" class="hidden"></div>
<div id="menu" class="hidden"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
